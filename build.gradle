plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = 'com.simibubi'
version = "${mod_version}-mc${minecraft_version}-neoforge"

base {
    archivesName = 'create'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

// Minecraft 26.2 / FML prepares declared mixins very early. Keeping the
// mixin classes in a separate Gradle `client` source set can leave them outside
// the class path used during Mixin PREPARE (especially from IDE/dev launches).
// Compile Create's client Java and resources into the normal `main` output so
// create.client.mixins.json and every class it names are always in the same
// mod class path. Client-only classes are still only referenced on the client.
sourceSets {
    main {
        java {
            srcDir 'src/client/java'

            exclude 'com/simibubi/create/compat/rei/**'
            exclude 'com/simibubi/create/compat/fabric/**'
            exclude 'com/simibubi/create/compat/computercraft/implementation/**'
            exclude 'com/simibubi/create/compat/computercraft/AllComputerDisplaySource.java'
            exclude 'com/simibubi/create/compat/computercraft/AllComputerPeripherals.java'
            exclude 'com/simibubi/create/compat/computercraft/ComputerDisplaySource.java'
            exclude 'com/simibubi/create/compat/computercraft/ComputerIntegration.java'
            exclude 'com/simibubi/create/compat/eiv/**'
            exclude 'com/simibubi/create/mixin/ArchitecturyMixin.java'
            exclude 'com/simibubi/create/mixin/MenuProviderMixin.java'
            exclude 'com/simibubi/create/mixin/ReloadListenerMixin.java'
            exclude 'com/simibubi/create/infrastructure/transfer/FluidInventorySlotWrapper.java'
            exclude 'com/simibubi/create/infrastructure/transfer/FluidInventoryStorage.java'
            exclude 'com/simibubi/create/infrastructure/transfer/FluidInventoryStorageImpl.java'
            exclude 'com/simibubi/create/infrastructure/transfer/FluidItemContext.java'
            exclude 'com/simibubi/create/infrastructure/transfer/SidedFluidInventorySlotWrapper.java'
            exclude 'com/simibubi/create/infrastructure/transfer/SidedFluidInventoryStorageImpl.java'
            exclude 'com/simibubi/create/infrastructure/transfer/SingleFluidStackStorage.java'

            // NeoForge client exclusions previously applied to sourceSets.client.
            exclude 'com/simibubi/create/client/compat/rei/**'
            exclude 'com/simibubi/create/client/compat/eiv/**'
            exclude 'com/simibubi/create/client/compat/rrv/**'
            exclude 'com/simibubi/create/client/compat/jei/**'
            exclude 'com/simibubi/create/client/compat/fabric/**'
            exclude 'com/simibubi/create/client/compat/trinkets/**'
            exclude 'com/simibubi/create/client/mixin/CraftingViewRecipeAccessor.java'
            exclude 'com/simibubi/create/client/mixin/FabricEIVMixin.java'
            exclude 'com/simibubi/create/client/mixin/FluidItemSpecialRendererMixin.java'
            exclude 'com/simibubi/create/client/mixin/IrisPipelinesMixin.java'
            exclude 'com/simibubi/create/client/mixin/ItemSlotMixin.java'
            exclude 'com/simibubi/create/client/mixin/ItemFeatureRendererMixin.java'
            exclude 'com/simibubi/create/client/mixin/ClientPackSourceMixin.java'
            exclude 'com/simibubi/create/client/mixin/ModelMixin.java'
            exclude 'com/simibubi/create/client/mixin/ModelPartMixin.java'
            exclude 'com/simibubi/create/client/mixin/QuadRenderHelperMixin.java'
            exclude 'com/simibubi/create/client/mixin/RecipeViewMenuMixin.java'
            exclude 'com/simibubi/create/client/mixin/RecipeViewScreenMixin.java'
            exclude 'com/simibubi/create/client/mixin/RrvRecipeViewMenuMixin.java'
            exclude 'com/simibubi/create/client/mixin/RrvRecipeViewScreenMixin.java'
            exclude 'com/simibubi/create/client/mixin/ViewTypeButtonMixin.java'
            exclude 'com/simibubi/create/client/flywheel/lib/model/baked/FabricEmitterSupplier.java'
            exclude 'com/simibubi/create/client/flywheel/lib/model/baked/DualVertexConsumer.java'
            exclude 'com/simibubi/create/client/foundation/model/FabricBakedModelHelper.java'
            exclude 'com/simibubi/create/client/mixin/BufferAoPoseEmitterMixin.java'
            exclude 'com/simibubi/create/client/mixin/BufferColorPoseEmitterMixin.java'
            exclude 'com/simibubi/create/client/mixin/BufferEmitterMixin.java'
            exclude 'com/simibubi/create/client/mixin/BufferPoseEmitterMixin.java'
            exclude 'com/simibubi/create/client/mixin/ConnectedTextureBehaviourMixin.java'
            exclude 'com/simibubi/create/client/mixin/CopycatModelMixin.java'
            exclude 'com/simibubi/create/client/mixin/CopycatPanelModelMixin.java'
            exclude 'com/simibubi/create/client/mixin/CopycatStepModelMixin.java'
            exclude 'com/simibubi/create/client/mixin/ItemModelRenderHelperMixin.java'
            exclude 'com/simibubi/create/client/mixin/ModelRenderHelperMixin.java'
            exclude 'com/simibubi/create/client/mixin/WrapperBlockStateModelAccessor.java'
            exclude 'com/simibubi/create/client/mixin/WrapperBlockStateModelMixin.java'
        }
        resources {
            srcDir 'src/client/resources'
            srcDir 'src/generated/resources'
            exclude 'fabric.mod.json'
            exclude 'create.classtweaker'
            exclude '_data/**'
        }
    }
}

neoForge {
    version = neo_version
    accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg')
    interfaceInjectionData = files('src/main/resources/META-INF/create-injected-interfaces.json')

    mods {
        create {
            sourceSet sourceSets.main
        }
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'create'
            systemProperty 'fml.earlyprogresswindow', 'false'
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        clientData {
            clientData()
            programArguments.addAll '--mod', 'create', '--all',
                '--output', file('src/generated/resources').absolutePath,
                '--existing', file('src/main/resources').absolutePath
        }
        serverData {
            serverData()
            programArguments.addAll '--mod', 'create', '--all',
                '--output', file('src/generated/resources').absolutePath,
                '--existing', file('src/main/resources').absolutePath
        }
    }
}

repositories {
    mavenCentral()
}

// Client sources are intentionally part of sourceSets.main on 26.2, so the
// normal `classes` task is sufficient for Gradle and IDE launches.

tasks.register('verifyClientMixinDevOutput') {
    dependsOn tasks.named('classes')

    doLast {
        def requiredClientClasses = [
            'com/simibubi/create/client/mixin/MixinPlugin.class',
            'com/simibubi/create/client/mixin/AbstractClientPlayerMixin.class',
            'com/simibubi/create/client/mixin/AvatarRendererMixin.class',
            'com/simibubi/create/client/mixin/BlockStateModelLoaderMixin.class'
        ]

        requiredClientClasses.each { entry ->
            boolean present = sourceSets.main.output.classesDirs.files.any { dir ->
                new File(dir, entry).isFile()
            }
            if (!present) {
                throw new GradleException("Create main dev output is missing required client mixin class: ${entry}")
            }
        }
    }
}

tasks.matching { task ->
    task.name == 'runClient' || task.name == 'runClientData' || task.name == 'runGameTestClient'
}.configureEach {
    dependsOn tasks.named('verifyClientMixinDevOutput')
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.compilerArgs += ['-Xmaxerrs', '500']
}

tasks.named('processResources', ProcessResources) {
    // On Windows, IDE and antivirus file watchers can invalidate Gradle's
    // output snapshot while this large resource tree is being copied.
    // Resources are generated outputs, so always processing them is safe.
    doNotTrackState('Avoid intermittent Windows resource snapshot failures')
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version, neo_version: neo_version
    }
}

tasks.named('jar', Jar) {
    // Client sources are compiled into main.output, so the default jar already
    // contains create.client.mixins.json and all companion mixin classes.
    from('LICENSE')
    from('licenses') {
        into 'licenses'
    }
    manifest {
        attributes(
            'MixinConfigs': 'create.mixins.json,create.client.mixins.json'
        )
    }
}

// Regression guard for the exact production crash that prompted this change.
// A successful `build` now proves that both the client mixin config and the
// critical classes it references are actually present in the distributable jar.
tasks.register('verifyCreateJar') {
    dependsOn tasks.named('jar')

    doLast {
        def jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def requiredEntries = [
            'create.mixins.json',
            'create.client.mixins.json',
            'META-INF/services/com.simibubi.create.api.registry.CreateRegisterPlugin',
            'com/simibubi/create/AllEarlyRegistries.class',
            'com/simibubi/create/content/kinetics/RotationPropagator.class',
            'com/simibubi/create/content/kinetics/base/KineticBlockEntity.class',
            'com/simibubi/create/mixin/LivingEntityMixin.class',
            'com/simibubi/create/client/mixin/MixinPlugin.class',
            'com/simibubi/create/client/mixin/AbstractClientPlayerMixin.class',
            'com/simibubi/create/client/mixin/EntityFluidInteractionMixin.class',
            'com/simibubi/create/client/mixin/CuboidModelMixin.class',
            'com/simibubi/create/client/mixin/ModelBlockRendererMixin.class',
            'com/simibubi/create/client/flywheel/impl/visualization/VisualizerRegistryImpl.class',
            'com/simibubi/create/client/flywheel/impl/extension/BlockEntityTypeExtension.class',
            'com/simibubi/create/client/flywheel/impl/extension/EntityTypeExtension.class',
            'com/simibubi/create/client/model/UnbakedModelParser.class',
            'assets/create/blockstates/creative_motor.json',
            'assets/create/blockstates/water_wheel.json',
            'assets/create/blockstates/large_water_wheel.json',
            'assets/create/models/block/creative_motor/block.json',
            'assets/create/models/block/water_wheel/wheel.json',
            'assets/create/models/block/water_wheel/water_wheel.obj',
            'assets/create/models/block/large_water_wheel/block.json',
            'assets/create/models/block/large_water_wheel/waterwheel_large.obj',
            'assets/create/textures/block/creative_motor.png',
            'assets/create/textures/block/waterwheel_metal.png'
        ]
        def jarContents = zipTree(jarFile)

        requiredEntries.each { entry ->
            if (jarContents.matching { include entry }.files.empty) {
                throw new GradleException("Create production jar is missing required entry: ${entry}")
            }
        }

        if (!jarContents.matching { include 'com/zurrtum/**' }.files.empty) {
            throw new GradleException('Create production jar still contains the incompatible com.zurrtum namespace')
        }

        def commonMixinConfig = jarContents.matching { include 'create.mixins.json' }.singleFile.text
        if (commonMixinConfig.contains('RegistryDataLoaderMixin')) {
            throw new GradleException(
                'Create production jar enables RegistryDataLoaderMixin, which duplicates NeoForge datapack registries'
            )
        }
    }
}

// Guard against restoring the pre-26.2 diving mixin. That old callback wrapped
// a LivingEntity#baseTick invocation that no longer exists in Minecraft 26.2
// and causes a fatal (0/1) Mixin injection failure during startup.
tasks.register('verifyLivingEntityMixinPort') {
    doLast {
        def source = file('src/main/java/com/simibubi/create/mixin/LivingEntityMixin.java').text
        if (source.contains('private boolean breathInLava(')) {
            throw new GradleException('LivingEntityMixin still contains the obsolete breathInLava WrapOperation callback')
        }
        if (!source.contains('create$tickDivingAir')) {
            throw new GradleException('LivingEntityMixin is missing the Minecraft 26.2 diving-air replacement injection')
        }
        if (!source.contains('isEyeInFluid(FluidTags.LAVA)')) {
            throw new GradleException('LivingEntityMixin lava breathing must be eye-submersion based')
        }
    }
}

// Guard against the kinetic "ghost model" regression. The wrapper map must
// exist before Minecraft's first block-state model bake, and the native model
// renderer mixin must remain available to call WrapperBlockStateModel#addPartsWithInfo.
tasks.register('verifyKineticModelPort') {
    doLast {
        def neoClient = file('src/client/java/com/simibubi/create/client/CreateNeoForgeClient.java').text
        if (!neoClient.contains('AllModels.register();')) {
            throw new GradleException('CreateNeoForgeClient must register AllModels before initial model baking')
        }
        def allModels = file('src/client/java/com/simibubi/create/client/AllModels.java').text
        if (!allModels.contains('private static boolean registered;')) {
            throw new GradleException('AllModels.register() must stay idempotent for early NeoForge registration')
        }
        def modelLoaderMixin = file('src/client/java/com/simibubi/create/client/mixin/BlockStateModelLoaderMixin.java').text
        if (!modelLoaderMixin.contains('AllModels.register();')) {
            throw new GradleException('BlockStateModelLoaderMixin must ensure model wrappers are registered before baking')
        }
        def plugin = file('src/client/java/com/simibubi/create/client/mixin/MixinPlugin.java').text
        if (!plugin.contains('"ModelBlockRendererMixin"')) {
            throw new GradleException('Native ModelBlockRendererMixin is required for kinetic wrapper models')
        }
    }
}

// Guard the Minecraft 26.2 OBJ-model fix used by chain conveyors and water wheels.
// NeoForge PR #3355 fixed ModelState/UV-lock handling in the 26.2 OBJ loader; Create's
// older copied OBJ code must not silently bypass that fix again.
tasks.register('verifyObjKineticTexturePort') {
    doLast {
        def parser = file('src/client/java/com/simibubi/create/client/model/UnbakedModelParser.java').text
        if (!parser.contains('net.neoforged.neoforge.client.model.obj.ObjLoader')) {
            throw new GradleException('UnbakedModelParser must use NeoForge 26.2 native ObjLoader')
        }
        if (parser.contains('com.simibubi.create.client.model.obj.ObjLoader')) {
            throw new GradleException('UnbakedModelParser still routes neoforge:obj through the stale Create copy')
        }

        def geometry = file('src/client/java/com/simibubi/create/client/model/obj/ObjGeometry.java').text
        if (!geometry.contains('inverseFaceTransformation')) {
            throw new GradleException('Fallback ObjGeometry is missing 26.2 inverse face UV transformation')
        }
        if (!geometry.contains('composeRootTransformIntoModelState')) {
            throw new GradleException('Fallback ObjGeometry is dropping ModelState while composing root transforms')
        }

        def minecraftMixin = file('src/client/java/com/simibubi/create/client/mixin/MinecraftMixin.java').text
        if (minecraftMixin.contains('registerReloadListener(ObjLoader.INSTANCE)')) {
            throw new GradleException('MinecraftMixin must not separately register the stale copied OBJ reloader')
        }
    }
}


// Verify the Minecraft 26.2 menu/mixin source layout. NeoForge's dev composite
// validates mixin declarations from neoforge.mods.toml against the main resource
// root, so create.client.mixins.json must live in src/main/resources.
tasks.register('verifyClientMenuAndMixinPort') {
    doLast {
        def clientMixin = file('src/main/resources/create.client.mixins.json')
        if (!clientMixin.exists()) {
            throw new GradleException('create.client.mixins.json must exist in src/main/resources for NeoForge 26.2 dev runs')
        }
        if (file('src/client/resources/create.client.mixins.json').exists()) {
            throw new GradleException('create.client.mixins.json must not be left only in src/client/resources')
        }

        def menuButton = file('src/client/java/com/simibubi/create/client/infrastructure/gui/OpenCreateMenuButton.java').text
        if (menuButton.contains('super.extractContents(')) {
            throw new GradleException('OpenCreateMenuButton cannot call abstract Button.extractContents() on Minecraft 26.x')
        }
        if (!menuButton.contains('this.extractDefaultSprite(graphics);')) {
            throw new GradleException('OpenCreateMenuButton must render the vanilla button sprite explicitly')
        }
        if (menuButton.contains('AllItems.GOGGLES.getDefaultInstance()') || menuButton.contains('graphics.item(')) {
            throw new GradleException('Title-screen Create button must not construct/render an ItemStack before 26.2 components are bound')
        }
        if (!menuButton.contains('textures/item/goggles.png') || !menuButton.contains('RenderPipelines.GUI_TEXTURED')) {
            throw new GradleException('OpenCreateMenuButton must use the texture-only goggles icon path')
        }

        def goggleConfig = file('src/client/java/com/simibubi/create/client/content/equipment/goggles/GoggleConfigScreen.java').text
        if (goggleConfig.contains('AllItems.GOGGLES.getDefaultInstance()') || goggleConfig.contains('graphics.item(')) {
            throw new GradleException('GoggleConfigScreen must not construct an ItemStack when opened from the title screen')
        }
        if (!goggleConfig.contains('textures/item/goggles.png')) {
            throw new GradleException('GoggleConfigScreen must render the texture-only goggles icon')
        }

        def gogglesTexture = file('src/client/resources/assets/create/textures/item/goggles.png')
        if (!gogglesTexture.exists()) {
            throw new GradleException('Texture-only title-screen goggles icon is missing')
        }

        def enUs = file('src/main/resources/assets/create/lang/en_us.json')
        if (!enUs.exists()) {
            throw new GradleException('Create en_us.json must be available from the main resource root')
        }
    }
}

tasks.named('build') {
    dependsOn tasks.named('verifyClientMixinDevOutput')
    dependsOn tasks.named('verifyClientMenuAndMixinPort')
    dependsOn tasks.named('verifyKineticModelPort')
    dependsOn tasks.named('verifyLivingEntityMixinPort')
    dependsOn tasks.named('verifyCreateJar')
    dependsOn tasks.named('verifyObjKineticTexturePort')
}


// Minecraft 26.2: direct BlockStateModel.collectParts() calls must not expose the
// stationary baked shaft/cog/wheel underneath Create's animated kinetic renderer.
tasks.register('verifyKineticGhostModelPort12') {
    doLast {
        def bracketed = file('src/client/java/com/simibubi/create/client/infrastructure/model/BracketedKineticBlockModel.java').text
        if (!bracketed.contains('public void collectParts(RandomSource random, List<BlockStateModelPart> parts)')) {
            throw new GradleException('BracketedKineticBlockModel is missing the direct collectParts ghost-model guard')
        }
        if (!bracketed.contains('Intentionally empty. The real rotating geometry is rendered by Create.')) {
            throw new GradleException('BracketedKineticBlockModel collectParts guard appears to have been changed')
        }

        def wheel = file('src/client/java/com/simibubi/create/client/infrastructure/model/LargeWaterWheelModel.java').text
        if (!wheel.contains('Never submit the stationary baked wheel')) {
            throw new GradleException('LargeWaterWheelModel is missing the direct collectParts ghost-wheel guard')
        }
    }
}

tasks.named('build') {
    dependsOn tasks.named('verifyKineticGhostModelPort12')
}

// Port.13 regression guard: keep the restored 1.21.1-style Create main menu.
tasks.register('verifyCreate1211StyleMenu') {
    doLast {
        def source = file('src/client/java/com/simibubi/create/client/infrastructure/gui/CreateMainMenuScreen.java').text
        [
            'AllBlocks.LARGE_COGWHEEL',
            'AllBlocks.COGWHEEL',
            'AllGuiTextures.LOGO',
            'AllGuiTextures.CURSEFORGE_LOGO',
            'AllGuiTextures.MODRINTH_LOGO',
            'menu.configure',
            'menu.ponder_index',
            'menu.report_bugs',
            'menu.support',
            'menu.return'
        ].each { token ->
            if (!source.contains(token)) {
                throw new GradleException("Create 1.21.1-style menu regression: missing ${token}")
            }
        }
    }
}

tasks.named('build') {
    dependsOn tasks.named('verifyCreate1211StyleMenu')
}


// Minecraft 26.2 GUI block previews can render before Flywheel's first level reload.
// Keep ModelRenderHelper safe for title-screen Create cogwheel previews.
tasks.register('verifyGuiModelRenderInitPort') {
    doLast {
        def source = file('src/client/java/com/simibubi/create/client/flywheel/lib/model/baked/ModelRenderHelper.java').text
        if (!source.contains('ensureInitialized()'))
            throw new GradleException('ModelRenderHelper is missing lazy GUI initialization')
        if (!source.contains('AO_CULL_INSTANCE.updateOutput(output)') || !source.contains('return AO_CULL_INSTANCE'))
            throw new GradleException('AO cull helper is wired to the wrong consumer')
        if (!source.contains('AO_INSTANCE.updateOutput(output)') || !source.contains('return AO_INSTANCE'))
            throw new GradleException('AO helper is wired to the wrong consumer')
    }
}

tasks.named('build') {
    dependsOn tasks.named('verifyGuiModelRenderInitPort')
}

tasks.register('verifyDualChainConveyorPort') {
    doLast {
        def renderer = file('src/client/java/com/simibubi/create/client/content/kinetics/chainConveyor/ChainConveyorRenderer.java').text
        if (renderer.contains('ownsConnectionSpan('))
            throw new GradleException('Port 19 regression: single-owner chain-span suppression is still present')
        if (renderer.contains('renderChain ='))
            throw new GradleException('Port 19 regression: per-endpoint chain suppression flag is still present')
        if (!renderer.contains('chain.submit(matrices, state.chain, queue);'))
            throw new GradleException('Port 19 regression: chain geometry is not submitted')
    }
}

tasks.named('build') {
    dependsOn tasks.named('verifyDualChainConveyorPort')
}

// Port.20 regression guard: keep the stability/compatibility behavior that lets
// broken visuals, shaders, render mods, and source-ported addon registries fall
// back cleanly instead of disappearing or using invalid registry-ID networking.
tasks.register('verifyPort20StabilityCompatibility') {
    doLast {
        def visualManager = file('src/client/java/com/simibubi/create/client/flywheel/api/visualization/VisualManager.java').text
        if (!visualManager.contains('boolean isVisualized(T obj);'))
            throw new GradleException('Port 20 regression: VisualManager no longer exposes live-visual state')

        def helper = file('src/client/java/com/simibubi/create/client/flywheel/lib/visualization/VisualizationHelper.java').text
        if (!helper.contains('manager.blockEntities().isVisualized(blockEntity)'))
            throw new GradleException('Port 20 regression: block entities can suppress vanilla rendering before a live visual exists')
        if (!helper.contains('manager.entities().isVisualized(entity)'))
            throw new GradleException('Port 20 regression: entities can suppress vanilla rendering before a live visual exists')

        def storage = file('src/client/java/com/simibubi/create/client/flywheel/impl/visualization/storage/Storage.java').text
        if (!storage.contains('Flywheel visual update failed; switched object to fallback renderer'))
            throw new GradleException('Port 20 regression: failed visual updates do not fall back safely')
        if (!storage.contains('safeDelete(Visual visual)'))
            throw new GradleException('Port 20 regression: visual cleanup is not guarded')

        def blockStorage = file('src/client/java/com/simibubi/create/client/flywheel/impl/visualization/storage/BlockEntityStorage.java').text
        if (!blockStorage.contains('FAILED_VISUAL_TYPES.contains(obj.getType())'))
            throw new GradleException('Port 20 regression: repeatedly failing block visual types are not suppressed')

        def managerImpl = file('src/client/java/com/simibubi/create/client/flywheel/impl/visualization/VisualManagerImpl.java').text
        if (!managerImpl.contains('IdentityHashMap') || !managerImpl.contains('Map<T, Action> pending'))
            throw new GradleException('Port 20 regression: repeated visual transactions are no longer coalesced')

        def iris = file('src/client/java/com/simibubi/create/client/flywheel/impl/compat/IrisCompat.java').text
        if (!iris.contains('net.irisshaders.iris.api.v0.IrisApi') || !iris.contains('isShaderPackInUse'))
            throw new GradleException('Port 20 regression: Iris shader-pack state detection is missing')
        if (iris.contains('import net.irisshaders.'))
            throw new GradleException('Port 20 regression: Iris compatibility has regained a hard compile-time dependency')

        def sodium = file('src/client/java/com/simibubi/create/client/flywheel/impl/compat/SodiumCompat.java').text
        if (!sodium.contains('BlockEntityRenderHandler') || !sodium.contains('Proxy.newProxyInstance'))
            throw new GradleException('Port 20 regression: Sodium block-entity fallback integration is missing')
        if (sodium.contains('import net.caffeinemc.mods.sodium.'))
            throw new GradleException('Port 20 regression: Sodium compatibility has regained a hard compile-time dependency')

        def codecs = file('src/main/java/com/simibubi/create/api/registry/CreateStreamCodecs.java').text
        if (!codecs.contains('Identifier.STREAM_CODEC') || !codecs.contains('registryByName'))
            throw new GradleException('Port 20 regression: stable-name Create registry networking helper is missing')

        def itemAttribute = file('src/main/java/com/simibubi/create/content/logistics/item/filter/attribute/ItemAttribute.java').text
        def packageTarget = file('src/main/java/com/simibubi/create/content/logistics/packagePort/PackagePortTarget.java').text
        if (!itemAttribute.contains('CreateStreamCodecs.registryByName(CreateRegistries.ITEM_ATTRIBUTE_TYPE)'))
            throw new GradleException('Port 20 regression: item attribute networking is not using stable registry names')
        if (!packageTarget.contains('CreateStreamCodecs.registryByName(CreateRegistries.PACKAGE_PORT_TARGET_TYPE)'))
            throw new GradleException('Port 20 regression: package target networking is not using stable registry names')

        def create = file('src/main/java/com/simibubi/create/Create.java').text
        if (!create.contains('public static final String ID = MOD_ID;') || !create.contains('Identifier asResource(String path)'))
            throw new GradleException('Port 20 regression: upstream addon compatibility aliases are missing')
    }
}

tasks.named('build') {
    dependsOn tasks.named('verifyPort20StabilityCompatibility')
}

// Port.21 regression guard: Iris can toggle shader-pack state without a full
// resource reload. Never suppress the vanilla/Sodium renderer while the active
// Flywheel backend has become unsupported.
tasks.register('verifyPort21IrisShaderFallback') {
    doLast {
        def manager = file('src/client/java/com/simibubi/create/client/flywheel/impl/visualization/VisualizationManagerImpl.java').text
        if (!manager.contains('BackendManagerImpl.isVisualizationBackendAvailable()'))
            throw new GradleException('Port 21 regression: visualization does not use the shader-safe runtime backend gate')

        def backend = file('src/client/java/com/simibubi/create/client/flywheel/impl/BackendManagerImpl.java').text
        if (!backend.contains('refreshForShaderPackState(ClientLevel level)'))
            throw new GradleException('Port 21 regression: runtime Iris shader state transition handling is missing')
        if (!backend.contains('ShadersModHelper.isShaderPackInUse()'))
            throw new GradleException('Port 21 regression: backend manager is not checking current shader-pack state')
        if (!backend.contains('VisualizationManagerImpl.reset(level)'))
            throw new GradleException('Port 21 regression: shader transition does not reset stale Flywheel visuals')

        def context = file('src/client/java/com/simibubi/create/client/flywheel/impl/event/RenderContextImpl.java').text
        if (!context.contains('BackendManagerImpl.refreshForShaderPackState(level);'))
            throw new GradleException('Port 21 regression: shader transition check is not performed at render update time')
    }
}

tasks.named('build') {
    dependsOn tasks.named('verifyPort21IrisShaderFallback')
}

// Port.22 regression guard: while an Iris shader pack is active, cached Create
// block geometry must use vanilla moving-block RenderTypes that shader mods can
// route correctly. Do not fall back to the Ponder/cardinal-lighting pipelines.
tasks.register('verifyPort22IrisMovingBlockRenderFallback') {
    doLast {
        def source = file('src/client/java/com/simibubi/create/client/catnip/render/EntityBlockRenderType.java').text
        if (!source.contains('BackendManagerImpl.isShaderPackInUseCached()'))
            throw new GradleException('Port 22 regression: cached shader-aware entity block render type selection is missing')
        ['RenderTypes.solidMovingBlock()', 'RenderTypes.cutoutMovingBlock()', 'RenderTypes.translucentMovingBlock()'].each { token ->
            if (!source.contains(token))
                throw new GradleException("Port 22 regression: missing vanilla shader-compatible moving-block render type ${token}")
        }
        if (!source.contains('shaderCompatibleMovingBlockType()'))
            throw new GradleException('Port 22 regression: moving block shader fallback helper is missing')

        def backend = file('src/client/java/com/simibubi/create/client/flywheel/impl/BackendManagerImpl.java').text
        if (!backend.contains('isShaderPackInUseCached()'))
            throw new GradleException('Port 22 regression: hot render paths no longer use cached shader-pack state')
    }
}

tasks.named('build') {
    dependsOn tasks.named('verifyPort22IrisMovingBlockRenderFallback')
}
