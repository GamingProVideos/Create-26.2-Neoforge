plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = 'com.zurrtum'
version = "${mod_version}-mc${minecraft_version}-neoforge"

base {
    archivesName = 'create'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

neoForge {
    version = neo_version
    accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg')
    interfaceInjectionData = files('src/main/resources/META-INF/create-injected-interfaces.json')

    mods {
        create {
            sourceSet sourceSets.main
        }
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'create'
            systemProperty 'fml.earlyprogresswindow', 'false'
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        clientData {
            clientData()
            programArguments.addAll '--mod', 'create', '--all',
                '--output', file('src/generated/resources').absolutePath,
                '--existing', file('src/main/resources').absolutePath
        }
        serverData {
            serverData()
            programArguments.addAll '--mod', 'create', '--all',
                '--output', file('src/generated/resources').absolutePath,
                '--existing', file('src/main/resources').absolutePath
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
}

sourceSets {
    main {
        java {
            srcDir 'src/client/java'

            exclude 'com/zurrtum/create/compat/rei/**'
            exclude 'com/zurrtum/create/compat/fabric/**'
            exclude 'com/zurrtum/create/compat/computercraft/implementation/**'
            exclude 'com/zurrtum/create/compat/computercraft/AllComputerDisplaySource.java'
            exclude 'com/zurrtum/create/compat/computercraft/AllComputerPeripherals.java'
            exclude 'com/zurrtum/create/compat/computercraft/ComputerDisplaySource.java'
            exclude 'com/zurrtum/create/compat/computercraft/ComputerIntegration.java'
            exclude 'com/zurrtum/create/compat/eiv/**'
            exclude 'com/zurrtum/create/client/compat/rei/**'
            exclude 'com/zurrtum/create/client/compat/eiv/**'
            exclude 'com/zurrtum/create/client/compat/rrv/**'
            exclude 'com/zurrtum/create/client/compat/jei/**'
            exclude 'com/zurrtum/create/client/compat/fabric/**'
            exclude 'com/zurrtum/create/client/compat/trinkets/**'
            exclude 'com/zurrtum/create/mixin/ArchitecturyMixin.java'
            exclude 'com/zurrtum/create/mixin/MenuProviderMixin.java'
            exclude 'com/zurrtum/create/mixin/ReloadListenerMixin.java'
            exclude 'com/zurrtum/create/client/mixin/CraftingViewRecipeAccessor.java'
            exclude 'com/zurrtum/create/client/mixin/FabricEIVMixin.java'
            exclude 'com/zurrtum/create/client/mixin/FluidItemSpecialRendererMixin.java'
            exclude 'com/zurrtum/create/client/mixin/IrisPipelinesMixin.java'
            exclude 'com/zurrtum/create/client/mixin/ItemSlotMixin.java'
            exclude 'com/zurrtum/create/client/mixin/ItemFeatureRendererMixin.java'
            exclude 'com/zurrtum/create/client/mixin/ClientPackSourceMixin.java'
            exclude 'com/zurrtum/create/client/mixin/ModelMixin.java'
            exclude 'com/zurrtum/create/client/mixin/ModelPartMixin.java'
            exclude 'com/zurrtum/create/client/mixin/QuadRenderHelperMixin.java'
            exclude 'com/zurrtum/create/client/mixin/RecipeViewMenuMixin.java'
            exclude 'com/zurrtum/create/client/mixin/RecipeViewScreenMixin.java'
            exclude 'com/zurrtum/create/client/mixin/RrvRecipeViewMenuMixin.java'
            exclude 'com/zurrtum/create/client/mixin/RrvRecipeViewScreenMixin.java'
            exclude 'com/zurrtum/create/client/mixin/ViewTypeButtonMixin.java'

            // Fabric Renderer API adapters are not part of NeoForge. The
            // Minecraft 26.2-native model/render code remains enabled.
            exclude 'com/zurrtum/create/client/flywheel/lib/model/baked/FabricEmitterSupplier.java'
            exclude 'com/zurrtum/create/client/flywheel/lib/model/baked/DualVertexConsumer.java'
            exclude 'com/zurrtum/create/client/foundation/model/FabricBakedModelHelper.java'
            exclude 'com/zurrtum/create/client/mixin/BufferAoPoseEmitterMixin.java'
            exclude 'com/zurrtum/create/client/mixin/BufferColorPoseEmitterMixin.java'
            exclude 'com/zurrtum/create/client/mixin/BufferEmitterMixin.java'
            exclude 'com/zurrtum/create/client/mixin/BufferPoseEmitterMixin.java'
            exclude 'com/zurrtum/create/client/mixin/ConnectedTextureBehaviourMixin.java'
            exclude 'com/zurrtum/create/client/mixin/CopycatModelMixin.java'
            exclude 'com/zurrtum/create/client/mixin/CopycatPanelModelMixin.java'
            exclude 'com/zurrtum/create/client/mixin/CopycatStepModelMixin.java'
            exclude 'com/zurrtum/create/client/mixin/ItemModelRenderHelperMixin.java'
            exclude 'com/zurrtum/create/client/mixin/ModelRenderHelperMixin.java'
            exclude 'com/zurrtum/create/client/mixin/WrapperBlockStateModelAccessor.java'
            exclude 'com/zurrtum/create/client/mixin/WrapperBlockStateModelMixin.java'
            exclude 'com/zurrtum/create/infrastructure/transfer/FluidInventorySlotWrapper.java'
            exclude 'com/zurrtum/create/infrastructure/transfer/FluidInventoryStorage.java'
            exclude 'com/zurrtum/create/infrastructure/transfer/FluidInventoryStorageImpl.java'
            exclude 'com/zurrtum/create/infrastructure/transfer/FluidItemContext.java'
            exclude 'com/zurrtum/create/infrastructure/transfer/SidedFluidInventorySlotWrapper.java'
            exclude 'com/zurrtum/create/infrastructure/transfer/SidedFluidInventoryStorageImpl.java'
            exclude 'com/zurrtum/create/infrastructure/transfer/SingleFluidStackStorage.java'
        }
        resources {
            srcDir 'src/client/resources'
            srcDir 'src/generated/resources'
            exclude 'fabric.mod.json'
            exclude 'create.classtweaker'
            exclude '_data/**'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.compilerArgs += ['-Xmaxerrs', '500']
}

tasks.named('processResources', ProcessResources) {
    // On Windows, IDE and antivirus file watchers can invalidate Gradle's
    // output snapshot while this large resource tree is being copied.
    // Resources are generated outputs, so always processing them is safe.
    doNotTrackState('Avoid intermittent Windows resource snapshot failures')
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version, neo_version: neo_version
    }
}

jar {
    from('LICENSE')
    from('licenses') {
        into 'licenses'
    }
    manifest {
        attributes(
            'MixinConfigs': 'create.mixins.json,create.client.mixins.json'
        )
    }
}
